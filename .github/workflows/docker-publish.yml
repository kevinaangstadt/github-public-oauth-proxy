name: Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to manually trigger builds from the GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Replace 'your-repo-name' with your desired Docker Hub repo name
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/github-public-oauth-proxy:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/github-public-oauth-proxy:${{ github.sha }}
      
      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/github-public-oauth-proxy
          short-description: "Lightweight OAuth proxy for classroom GitHub API projects"
          readme-filepath: ./README.md